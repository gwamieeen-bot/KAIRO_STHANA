<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101C2C">
  <title>Login | KAIRO_STHANA</title>

  <style>
    :root {
      --navy: #101C2C;
      --navy-light: #172A3F;
      --turquoise: #20B7A8;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
      color: var(--white);
      background:
        radial-gradient(ellipse at 15% 20%, rgba(32,183,168,.16), transparent 40%),
        radial-gradient(ellipse at 85% 80%, rgba(32,183,168,.12), transparent 40%),
        var(--navy);
    }

    .ambient {
      position: fixed;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: var(--turquoise);
      filter: blur(130px);
      opacity: .12;
      pointer-events: none;
      animation: ambientMove 8s ease-in-out infinite alternate;
    }

    .ambient.one {
      top: -170px;
      left: -120px;
    }

    .ambient.two {
      bottom: -180px;
      right: -100px;
      animation-delay: -4s;
    }

    .login-box {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 410px;
      padding: 48px 35px;
      text-align: center;
      border: 1px solid rgba(32,183,168,.45);
      border-radius: 20px;
      background: rgba(16,28,44,.88);
      backdrop-filter: blur(16px);
      box-shadow:
        0 0 15px rgba(32,183,168,.12),
        0 0 45px rgba(32,183,168,.09),
        0 25px 70px rgba(0,0,0,.4);
      animation: enter .9s ease both, boxGlow 5s ease-in-out infinite alternate;
    }

    .logo {
      color: var(--white);
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 13px;
      text-shadow: 0 0 12px rgba(32,183,168,.65);
    }

    .subtitle {
      color: var(--white);
      opacity: .75;
      font-size: 10px;
      letter-spacing: 4px;
      margin-bottom: 42px;
    }

    h2 {
      color: var(--white);
      font-size: 23px;
      margin-bottom: 12px;
    }

    .description {
      color: var(--white);
      opacity: .75;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 15px;
      color: var(--white);
      background: #0B1726;
      border: 1px solid rgba(32,183,168,.35);
      border-radius: 9px;
      outline: none;
      margin-bottom: 19px;
      transition: .3s;
    }

    input::placeholder {
      color: rgba(255,255,255,.65);
    }

    input:focus {
      border-color: var(--turquoise);
      box-shadow: 0 0 13px rgba(32,183,168,.35);
    }

    button {
      width: 100%;
      padding: 15px;
      color: var(--white);
      background: var(--turquoise);
      border: 1px solid var(--turquoise);
      border-radius: 9px;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(32,183,168,.45);
      transition: .3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 15px rgba(32,183,168,.75),
        0 0 35px rgba(32,183,168,.35);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    #message {
      margin-top: 18px;
      font-size: 13px;
      color: var(--white);
      min-height: 18px;
    }

    footer {
      margin-top: 38px;
      color: var(--white);
      opacity: .7;
      font-size: 10px;
      letter-spacing: 2px;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes boxGlow {
      from {
        box-shadow: 0 0 15px rgba(32,183,168,.12), 0 25px 70px rgba(0,0,0,.4);
      }
      to {
        box-shadow: 0 0 28px rgba(32,183,168,.25), 0 25px 70px rgba(0,0,0,.4);
      }
    }

    @keyframes ambientMove {
      from { transform: translate(0,0) scale(1); }
      to { transform: translate(35px,25px) scale(1.2); }
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 40px 25px;
      }

      .logo {
        font-size: 23px;
        letter-spacing: 3px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="ambient one"></div>
  <div class="ambient two"></div>

  <div class="login-box">
    <div class="logo">KAIRO_STHANA</div>
    <div class="subtitle">ONE SPACE. ONE IDENTITY.</div>

    <h2>Welcome Back</h2>
    <p class="description">
      Masukkan password untuk memasuki ruang Kairo.
    </p>

    <form id="loginForm">
      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        required
        autocomplete="current-password"
      >

      <button type="submit" id="loginButton">
        ENTER WEBSITE
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <footer>EST. 2026 · PRIVATE COMMUNITY</footer>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "CHECKING...";
      message.textContent = "";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            password: password.value
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          window.location.href = "/dashboard";
        } else {
          message.textContent = data.message || "Password salah.";
        }
      } catch (error) {
        message.textContent = "Server tidak dapat dihubungi.";
      }

      button.disabled = false;
      button.textContent = "ENTER WEBSITE";
    });
  </script>

</body>
</html>
