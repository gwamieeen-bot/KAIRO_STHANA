
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | KAIRO_STHANA</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080808;
      color: white;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 45px 35px;
      background: #121212;
      border: 1px solid #333;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 15px 50px #000;
    }

    .logo {
      font-size: 28px;
      letter-spacing: 5px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #888;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 35px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .description {
      color: #888;
      font-size: 13px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #080808;
      border: 1px solid #444;
      border-radius: 8px;
      color: white;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #aaa;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #eee;
      color: #111;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: .3s;
    }

    button:hover {
      background: #bbb;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      font-size: 13px;
      color: #ff7777;
      min-height: 18px;
    }

    footer {
      margin-top: 35px;
      color: #555;
      font-size: 10px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <div class="logo">KAIRO_STHANA</div>
    <div class="subtitle">ONE SPACE. ONE IDENTITY.</div>

    <h2>Welcome Back</h2>
    <p class="description">
      Masukkan password untuk memasuki ruang Kairo.
    </p>

    <form id="loginForm">
      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        required
        autocomplete="current-password"
      >

      <button type="submit" id="loginButton">
        ENTER WEBSITE
      </button>
    </form>

    <div id="message"></div>

    <footer>EST. 2026 · PRIVATE COMMUNITY</footer>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "CHECKING...";
      message.textContent = "";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            password: password.value
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          window.location.href = "/dashboard";
        } else {
          message.textContent = data.message || "Password salah.";
        }
      } catch (error) {
        message.textContent = "Server tidak dapat dihubungi.";
      }

      button.disabled = false;
      button.textContent = "ENTER WEBSITE";
    });
  </script>

</body>
</html>
